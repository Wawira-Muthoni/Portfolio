<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="400" fill="#f8f9fa" />
  
  <!-- Decorative header/footer -->
  <rect x="0" y="0" width="800" height="20" fill="#2ecc71" />
  <rect x="0" y="380" width="800" height="20" fill="#2ecc71" />
  
  <!-- House illustration -->
  <g transform="translate(80, 70)">
    <!-- House outline -->
    <path d="M30,120 L150,30 L270,120 L270,250 L30,250 Z" fill="#ecf0f1" stroke="#34495e" stroke-width="3" />
    
    <!-- Roof -->
    <path d="M30,120 L150,30 L270,120" fill="none" stroke="#34495e" stroke-width="5" />
    
    <!-- Door -->
    <rect x="120" y="170" width="60" height="80" fill="#e67e22" stroke="#34495e" stroke-width="2" />
    <circle cx="165" cy="210" r="5" fill="#34495e" />
    
    <!-- Windows -->
    <rect x="60" y="140" width="40" height="40" fill="#3498db" stroke="#34495e" stroke-width="2" />
    <line x1="60" y1="160" x2="100" y2="160" stroke="#34495e" stroke-width="2" />
    <line x1="80" y1="140" x2="80" y2="180" stroke="#34495e" stroke-width="2" />
    
    <rect x="200" y="140" width="40" height="40" fill="#3498db" stroke="#34495e" stroke-width="2" />
    <line x1="200" y1="160" x2="240" y2="160" stroke="#34495e" stroke-width="2" />
    <line x1="220" y1="140" x2="220" y2="180" stroke="#34495e" stroke-width="2" />
  </g>
  
  <!-- Data visualization elements -->
  <g transform="translate(400, 70)">
    <!-- Scatter plot with trend line -->
    <rect x="0" y="0" width="300" height="200" fill="white" stroke="#bdc3c7" stroke-width="2" />
    
    <!-- Axes -->
    <line x1="20" y1="180" x2="280" y2="180" stroke="#34495e" stroke-width="2" /> <!-- x-axis -->
    <line x1="20" y1="20" x2="20" y2="180" stroke="#34495e" stroke-width="2" /> <!-- y-axis -->
    
    <!-- Scatter points -->
    <circle cx="50" cy="150" r="5" fill="#3498db" />
    <circle cx="80" cy="120" r="5" fill="#3498db" />
    <circle cx="110" cy="130" r="5" fill="#3498db" />
    <circle cx="140" cy="100" r="5" fill="#3498db" />
    <circle cx="170" cy="80" r="5" fill="#3498db" />
    <circle cx="200" cy="70" r="5" fill="#3498db" />
    <circle cx="230" cy="60" r="5" fill="#3498db" />
    <circle cx="260" cy="40" r="5" fill="#3498db" />
    
    <!-- Regression line -->
    <line x1="40" y1="160" x2="270" y2="35" stroke="#e74c3c" stroke-width="3" />
    
    <!-- Feature icons -->
    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="40" height="40" rx="5" fill="#f39c12" />
      <text x="20" y="25" text-anchor="middle" font-family="Arial" font-size="20" fill="white">ft²</text>
    </g>
    
    <g transform="translate(70, 220)">
      <rect x="0" y="0" width="40" height="40" rx="5" fill="#9b59b6" />
      <text x="20" y="25" text-anchor="middle" font-family="Arial" font-size="20" fill="white">🛌</text>
    </g>
    
    <g transform="translate(120, 220)">
      <rect x="0" y="0" width="40" height="40" rx="5" fill="#16a085" />
      <text x="20" y="25" text-anchor="middle" font-family="Arial" font-size="20" fill="white">🚿</text>
    </g>
    
    <g transform="translate(170, 220)">
      <rect x="0" y="0" width="40" height="40" rx="5" fill="#2980b9" />
      <text x="20" y="25" text-anchor="middle" font-family="Arial" font-size="20" fill="white">📍</text>
    </g>
    
    <g transform="translate(220, 220)">
      <rect x="0" y="0" width="40" height="40" rx="5" fill="#c0392b" />
      <text x="20" y="25" text-anchor="middle" font-family="Arial" font-size="20" fill="white">⏱️</text>
    </g>
  </g>
  
  <!-- Algorithm representation -->
  <g transform="translate(400, 40)">
    <text x="150" y="0" text-anchor="middle" font-family="Arial" font-size="14" fill="#7f8c8d">Random Forest | Gradient Boosting | Linear Regression</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="340" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#2c3e50">House Price Prediction Project</text>
  <text x="400" y="365" text-anchor="middle" font-family="Arial" font-size="16" fill="#7f8c8d">Machine Learning for Real Estate Valuation</text>
</svg>
