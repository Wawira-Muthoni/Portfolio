<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="400" fill="#141414" />
  
  <!-- Netflix logo stylized -->
  <rect x="50" y="50" width="30" height="100" rx="2" fill="#E50914" />
  <path d="M100,50 L100,150 L130,150 L130,125 L110,125 L110,50 Z" fill="#E50914" />
  <path d="M145,50 L145,150 L175,150 L175,125 L155,125 L155,100 L170,100 L170,75 L155,75 L155,50 Z" fill="#E50914" />
  <path d="M190,50 L190,150 L220,150 L220,50 Z" fill="#E50914" />
  <path d="M235,50 L235,150 L265,150 L265,50 Z" fill="#E50914" />
  <path d="M280,50 L280,150 L310,150 L310,75 L295,75 L295,50 Z" fill="#E50914" />
  
  <!-- Stock chart -->
  <g transform="translate(380, 40)">
    <!-- Chart background -->
    <rect x="0" y="0" width="380" height="160" fill="#252525" rx="5" />
    
    <!-- Grid lines -->
    <line x1="0" y1="40" x2="380" y2="40" stroke="#444" stroke-width="1" />
    <line x1="0" y1="80" x2="380" y2="80" stroke="#444" stroke-width="1" />
    <line x1="0" y1="120" x2="380" y2="120" stroke="#444" stroke-width="1" />
    
    <line x1="76" y1="0" x2="76" y2="160" stroke="#444" stroke-width="1" />
    <line x1="152" y1="0" x2="152" y2="160" stroke="#444" stroke-width="1" />
    <line x1="228" y1="0" x2="228" y2="160" stroke="#444" stroke-width="1" />
    <line x1="304" y1="0" x2="304" y2="160" stroke="#444" stroke-width="1" />
    
    <!-- Actual stock line -->
    <path d="M0,80 C38,110 76,50 114,70 C152,90 190,30 228,20 C266,10 304,40 342,25 L342,160 L0,160 Z" fill="#E50914" fill-opacity="0.2" />
    <path d="M0,80 C38,110 76,50 114,70 C152,90 190,30 228,20 C266,10 304,40 342,25" fill="none" stroke="#E50914" stroke-width="3" />
    
    <!-- Prediction line (dotted) -->
    <path d="M342,25 C357,20 372,40 380,30" fill="none" stroke="#4CAF50" stroke-width="3" stroke-dasharray="5,5" />
    
    <!-- Prediction cone -->
    <path d="M342,25 C357,15 372,30 380,20 L380,50 C372,53 357,35 342,25 Z" fill="#4CAF50" fill-opacity="0.2" />
    <path d="M342,25 C357,35 372,45 380,40" fill="none" stroke="#4CAF50" stroke-width="2" stroke-dasharray="5,5" />
    
    <!-- Prediction label -->
    <rect x="335" y="5" width="40" height="20" rx="3" fill="#4CAF50" fill-opacity="0.7" />
    <text x="355" y="18" font-family="Arial" font-size="10" fill="white" text-anchor="middle">PRED</text>
    
    <!-- Chart labels -->
    <text x="38" y="175" font-family="Arial" font-size="12" fill="#999" text-anchor="middle">Q1</text>
    <text x="114" y="175" font-family="Arial" font-size="12" fill="#999" text-anchor="middle">Q2</text>
    <text x="190" y="175" font-family="Arial" font-size="12" fill="#999" text-anchor="middle">Q3</text>
    <text x="266" y="175" font-family="Arial" font-size="12" fill="#999" text-anchor="middle">Q4</text>
    <text x="342" y="175" font-family="Arial" font-size="12" fill="#999" text-anchor="middle">Q1</text>
  </g>
  
  <!-- ML/AI elements -->
  <g transform="translate(50, 200)">
    <!-- Neural network visualization -->
    <circle cx="40" cy="30" r="10" fill="#E50914" />
    <circle cx="40" cy="70" r="10" fill="#E50914" />
    <circle cx="40" cy="110" r="10" fill="#E50914" />
    <circle cx="40" cy="150" r="10" fill="#E50914" />
    
    <circle cx="100" cy="40" r="10" fill="#999" />
    <circle cx="100" cy="80" r="10" fill="#999" />
    <circle cx="100" cy="120" r="10" fill="#999" />
    <circle cx="100" cy="160" r="10" fill="#999" />
    
    <circle cx="160" cy="50" r="10" fill="#999" />
    <circle cx="160" cy="90" r="10" fill="#999" />
    <circle cx="160" cy="130" r="10" fill="#999" />
    
    <circle cx="220" cy="60" r="10" fill="#999" />
    <circle cx="220" cy="100" r="10" fill="#999" />
    <circle cx="220" cy="140" r="10" fill="#999" />
    
    <circle cx="280" cy="90" r="12" fill="#4CAF50" />
    
    <!-- Connections -->
    <line x1="50" y1="30" x2="90" y2="40" stroke="#666" stroke-width="1" />
    <line x1="50" y1="30" x2="90" y2="80" stroke="#666" stroke-width="1" />
    <line x1="50" y1="70" x2="90" y2="40" stroke="#666" stroke-width="1" />
    <line x1="50" y1="70" x2="90" y2="80" stroke="#666" stroke-width="1" />
    <line x1="50" y1="70" x2="90" y2="120" stroke="#666" stroke-width="1" />
    <line x1="50" y1="110" x2="90" y2="80" stroke="#666" stroke-width="1" />
    <line x1="50" y1="110" x2="90" y2="120" stroke="#666" stroke-width="1" />
    <line x1="50" y1="110" x2="90" y2="160" stroke="#666" stroke-width="1" />
    <line x1="50" y1="150" x2="90" y2="120" stroke="#666" stroke-width="1" />
    <line x1="50" y1="150" x2="90" y2="160" stroke="#666" stroke-width="1" />
    
    <line x1="110" y1="40" x2="150" y2="50" stroke="#666" stroke-width="1" />
    <line x1="110" y1="40" x2="150" y2="90" stroke="#666" stroke-width="1" />
    <line x1="110" y1="80" x2="150" y2="50" stroke="#666" stroke-width="1" />
    <line x1="110" y1="80" x2="150" y2="90" stroke="#666" stroke-width="1" />
    <line x1="110" y1="80" x2="150" y2="130" stroke="#666" stroke-width="1" />
    <line x1="110" y1="120" x2="150" y2="90" stroke="#666" stroke-width="1" />
    <line x1="110" y1="120" x2="150" y2="130" stroke="#666" stroke-width="1" />
    <line x1="110" y1="160" x2="150" y2="130" stroke="#666" stroke-width="1" />
    
    <line x1="170" y1="50" x2="210" y2="60" stroke="#666" stroke-width="1" />
    <line x1="170" y1="50" x2="210" y2="100" stroke="#666" stroke-width="1" />
    <line x1="170" y1="90" x2="210" y2="60" stroke="#666" stroke-width="1" />
    <line x1="170" y1="90" x2="210" y2="100" stroke="#666" stroke-width="1" />
    <line x1="170" y1="90" x2="210" y2="140" stroke="#666" stroke-width="1" />
    <line x1="170" y1="130" x2="210" y2="100" stroke="#666" stroke-width="1" />
    <line x1="170" y1="130" x2="210" y2="140" stroke="#666" stroke-width="1" />
    
    <line x1="230" y1="60" x2="270" y2="90" stroke="#666" stroke-width="1" />
    <line x1="230" y1="100" x2="270" y2="90" stroke="#666" stroke-width="1" />
    <line x1="230" y1="140" x2="270" y2="90" stroke="#666" stroke-width="1" />
    
    <!-- Data labels -->
    <text x="40" y="180" font-family="Arial" font-size="10" fill="#999" text-anchor="middle">Input</text>
    <text x="160" y="180" font-family="Arial" font-size="10" fill="#999" text-anchor="middle">Hidden Layers</text>
    <text x="280" y="115" font-family="Arial" font-size="10" fill="#4CAF50" text-anchor="middle">Prediction</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="370" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Netflix Stock Price Prediction</text>
  <text x="400" y="395" font-family="Arial" font-size="16" fill="#999" text-anchor="middle">Machine Learning for Financial Forecasting</text>
</svg>
